name: Check public handoff
on: [push, pull_request]
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run --locked python scripts/prepare.py --models
      - run: uv run --locked python scripts/smoke.py
      - run: uv run --locked pytest -q
      - run: uv run --locked python .agents/skills/ntop-assembly-modeling/scripts/run_pilot.py --offline --out .local/assembly-pilot-offline
      - run: uv run --locked python demos/kestrelsat-corner/scripts/check_example.py
      - run: uv run --locked python scripts/audit.py
